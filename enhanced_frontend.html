<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Enhanced Voice Translator</title>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e3eafc;
      overflow-x: hidden;
    }

    .container {
      margin-top: 20px;
      background: #1a2636;
      border-radius: 18px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.18);
      padding: 36px 28px;
      max-width: 800px;
      width: 100%;
      border: 1.5px solid #274472;
      animation: fadeInUp 1.1s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #274472;
    }

    .tab {
      padding: 12px 24px;
      background: #22304a;
      border: none;
      color: #e3eafc;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      margin-right: 5px;
      transition: all 0.3s;
    }

    .tab.active {
      background: #41729f;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    button {
      margin: 5px 10px 15px 0;
      padding: 12px 32px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(44,83,100,0.08);
    }

    #startBtn {
      background: linear-gradient(90deg, #274472 0%, #41729f 100%);
      color: #fff;
    }

    #stopBtn {
      background: linear-gradient(90deg, #c31432 0%, #240b36 100%);
      color: #fff;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      font-size: 16px;
      border: 1.5px solid #274472;
      border-radius: 8px;
      background: #22304a;
      color: #e3eafc;
      outline: none;
    }

    h3 {
      margin-bottom: 5px;
      color: #7eb6ff;
      letter-spacing: 1px;
      font-size: 1.13em;
      font-weight: 600;
    }

    p {
      background: #22304a;
      padding: 14px;
      border-radius: 8px;
      min-height: 30px;
      color: #e3eafc;
      font-size: 18px;
      margin-bottom: 22px;
      border: 1.5px solid #274472;
    }

    .history-item {
      background: #22304a;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      border-left: 4px solid #41729f;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .stat-card {
      background: #22304a;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #274472;
    }

    .stat-number {
      font-size: 2em;
      color: #7eb6ff;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: #7eb6ff;
      font-style: italic;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('translator')">Translator</button>
      <button class="tab" onclick="showTab('history')">History</button>
      <button class="tab" onclick="showTab('stats')">Statistics</button>
    </div>

    <!-- Translator Tab -->
    <div id="translator" class="tab-content active">
      <h3>Voice Translation</h3>
      <label for="sourceLang">Source Language:</label>
      <select id="sourceLang">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
      </select>

      <label for="targetLang">Target Language:</label>
      <select id="targetLang">
        <option value="es">Spanish</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
      </select>

      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>

      <h3>Original Text:</h3>
      <p id="original"></p>
      <h3>Translated Text:</h3>
      <p id="translated"></p>
    </div>

    <!-- History Tab -->
    <div id="history" class="tab-content">
      <h3>Translation History</h3>
      <button onclick="loadHistory()">Refresh History</button>
      <div id="historyList"></div>
    </div>

    <!-- Statistics Tab -->
    <div id="stats" class="tab-content">
      <h3>Translation Statistics</h3>
      <button onclick="loadStats()">Refresh Stats</button>
      <div id="statsContent"></div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script>
    // Tab functionality
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    // Speech recognition setup
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const original = document.getElementById('original');
    const translated = document.getElementById('translated');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      alert('Your browser does not support Speech Recognition.');
    }

    const recognition = new SpeechRecognition();
    recognition.interimResults = false;
    recognition.continuous = false;

    let finalText = '';
    let recognitionActive = false;

    startBtn.onclick = () => {
      if (recognitionActive) return;
      finalText = '';
      original.textContent = '';
      translated.textContent = '';
      recognition.lang = sourceLang.value;
      recognition.start();
      recognitionActive = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      if (!recognitionActive) return;
      recognition.stop();
      recognitionActive = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    recognition.onresult = (event) => {
      finalText = event.results[0][0].transcript;
      original.textContent = finalText;
    };

    recognition.onend = async () => {
      recognitionActive = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      if (!finalText.trim()) {
        translated.textContent = 'No speech detected.';
        return;
      }

      translated.textContent = 'Translating...';

      try {
        const response = await fetch('http://localhost:5000/translate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            q: finalText,
            source: sourceLang.value,
            target: targetLang.value,
            format: 'text'
          })
        });

        if (!response.ok) throw new Error('API request failed');

        const data = await response.json();
        translated.textContent = data.translatedText || 'Translation failed.';
      } catch (err) {
        translated.textContent = 'Translation error: ' + err.message;
        console.error(err);
      }
    };

    recognition.onerror = (event) => {
      alert('Speech recognition error: ' + event.error);
      recognitionActive = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // History functionality
    async function loadHistory() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '<div class="loading">Loading history...</div>';

      try {
        const response = await fetch('http://localhost:5000/api/history');
        const data = await response.json();
        
        if (data.history && data.history.length > 0) {
          historyList.innerHTML = data.history.map(item => `
            <div class="history-item">
              <strong>${item.source_lang} → ${item.target_lang}</strong><br>
              <strong>Original:</strong> ${item.original}<br>
              <strong>Translated:</strong> ${item.translated}<br>
              <small>${item.timestamp}</small>
            </div>
          `).join('');
        } else {
          historyList.innerHTML = '<div class="loading">No translation history found.</div>';
        }
      } catch (err) {
        historyList.innerHTML = '<div class="loading">Error loading history: ' + err.message + '</div>';
      }
    }

    // Statistics functionality
    async function loadStats() {
      const statsContent = document.getElementById('statsContent');
      statsContent.innerHTML = '<div class="loading">Loading statistics...</div>';

      try {
        const response = await fetch('http://localhost:5000/api/stats');
        const data = await response.json();
        
        if (data.total_translations !== undefined) {
          statsContent.innerHTML = `
            <div class="stats-grid">
              <div class="stat-card">
                <div class="stat-number">${data.total_translations}</div>
                <div>Total Translations</div>
              </div>
              <div class="stat-card">
                <div class="stat-number">${data.popular_language_pairs.length}</div>
                <div>Language Pairs Used</div>
              </div>
            </div>
            <h4>Most Popular Language Pairs:</h4>
            ${data.popular_language_pairs.map(pair => `
              <div class="history-item">
                <strong>${pair.source} → ${pair.target}</strong>: ${pair.count} translations
              </div>
            `).join('')}
          `;
        } else {
          statsContent.innerHTML = '<div class="loading">No statistics available.</div>';
        }
      } catch (err) {
        statsContent.innerHTML = '<div class="loading">Error loading statistics: ' + err.message + '</div>';
      }
    }

    // Initialize Select2
    $(document).ready(function() {
      $('#sourceLang').select2();
      $('#targetLang').select2();
    });
  </script>
</body>
</html>
