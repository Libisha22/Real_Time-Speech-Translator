<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Voice translation application for real-time speech-to-text translation">
  <title>Voice Translator - Real-time Speech Translation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">

  <!-- Select2 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027 0%, #2c5364 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e3eafc;
      overflow-x: hidden;
    }

    .container {
      margin-top: 40px;
      background: #1a2636;
      border-radius: 18px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.18);
      padding: 36px 28px;
      max-width: 500px;
      width: 100%;
      border: 1.5px solid #274472;
      animation: fadeInUp 1.1s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      z-index: 2;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    button {
      margin: 5px 10px 15px 0;
      padding: 12px 32px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(44,83,100,0.08);
      outline: none;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 6px 24px 0 #27447255;
      filter: brightness(1.08);
    }

    #startBtn {
      background: linear-gradient(90deg, #274472 0%, #41729f 100%);
      color: #fff;
    }
    #startBtn:disabled {
      background: #27447299;
      color: #b0c4de;
      cursor: not-allowed;
    }
    #stopBtn {
      background: linear-gradient(90deg, #c31432 0%, #240b36 100%);
      color: #fff;
    }
    #stopBtn:disabled {
      background: #240b3699;
      color: #b0c4de;
      cursor: not-allowed;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      font-size: 16px;
      border: 1.5px solid #274472;
      border-radius: 8px;
      background: #22304a;
      color: #e3eafc;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      box-shadow: 0 1px 4px rgba(44,83,100,0.08);
    }
    select:focus, input[type="text"]:focus {
      border: 1.5px solid #41729f;
      box-shadow: 0 0 0 2px #41729f44;
    }

    .select2-container--default .select2-selection--single {
      background: #22304a;
      color: #e3eafc;
      border: 1.5px solid #274472;
      border-radius: 8px;
      height: 44px;
      display: flex;
      align-items: center;
      transition: border 0.2s;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
      color: #e3eafc;
      line-height: 44px;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
      height: 44px;
    }
    .select2-dropdown {
      background: #22304a;
      color: #e3eafc;
      border: 1.5px solid #274472;
    }
    .select2-results__option--highlighted {
      background: #274472 !important;
      color: #fff !important;
    }

    h3 {
      margin-bottom: 5px;
      color: #7eb6ff;
      letter-spacing: 1px;
      font-size: 1.13em;
      font-weight: 600;
      text-shadow: 0 2px 8px #0f202755;
    }

    p {
      background: #22304a;
      padding: 14px;
      border-radius: 8px;
      min-height: 30px;
      color: #e3eafc;
      font-size: 18px;
      margin-bottom: 22px;
      border: 1.5px solid #274472;
      word-break: break-word;
      box-shadow: 0 1px 4px rgba(44,83,100,0.08);
      transition: box-shadow 0.3s, background 0.3s;
    }
    #original {
      margin-bottom: 30px;
      background: #1a2636;
      border: 1.5px solid #22304a;
      color: #e3eafc;
      font-size: 18px;
      font-style: italic;
      opacity: 0.92;
    }
    #translated {
      background: #1e3556;
      border: 1.5px solid #41729f;
      color: #7eb6ff;
      box-shadow: 0 0 16px 2px #41729f55, 0 1px 4px rgba(44,83,100,0.08);
      animation: glowTrans 1.2s ease-in-out;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    @keyframes glowTrans {
      0% {
        box-shadow: 0 0 0 0 #41729f00;
        background: #1a2636;
      }
      60% {
        box-shadow: 0 0 24px 6px #41729f88;
        background: #22304a;
      }
      100% {
        box-shadow: 0 0 16px 2px #41729f55, 0 1px 4px rgba(44,83,100,0.08);
        background: #1e3556;
      }
    }
    label {
      color: #b0c4de;
      font-size: 15px;
      margin-bottom: 4px;
      display: block;
      letter-spacing: 0.2px;
    }
    /* Divider for clarity */
    .divider {
      width: 100%;
      height: 1.5px;
      background: linear-gradient(90deg, #22304a 0%, #41729f 100%);
      margin: 24px 0 18px 0;
      border-radius: 2px;
      opacity: 0.7;
      box-shadow: 0 1px 4px #22304a44;
    }
    /* Subtle floating background shapes for visual interest */
    .bg-shape {
      position: absolute;
      z-index: 0;
      border-radius: 50%;
      filter: blur(32px);
      opacity: 0.18;
      pointer-events: none;
      animation: floatShape 8s ease-in-out infinite alternate;
    }
    .bg-shape1 {
      width: 220px; height: 220px; left: -80px; top: 60px; background: #41729f;
      animation-delay: 0s;
    }
    .bg-shape2 {
      width: 160px; height: 160px; right: -60px; top: 320px; background: #274472;
      animation-delay: 2s;
    }
    @keyframes floatShape {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }
  </style>
</head>

    <h3>Original Text:</h3>
    <p id="original" role="textbox" aria-label="Original text display"></p>
    <div class="divider"></div>
    <h3>Translated Text:</h3>
    <p id="translated" role="textbox" aria-label="Translated text display"></p>
    </form>
  </div>

  <!-- Dependencies -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <script>
    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
      alert('Your browser does not support Speech Recognition. Please use Chrome, Edge, or Safari.');
    }

    const recognition = new SpeechRecognition();
    recognition.interimResults = false;
    recognition.continuous = false;

    // DOM Elements
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const original = document.getElementById('original');
    const translated = document.getElementById('translated');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');

    let finalText = '';
    let recognitionActive = false;

    // Initialize Select2
    $(document).ready(function () {
      $('#sourceLang').select2();
      $('#targetLang').select2();
      
      // Prevent form submission
      $('#translationForm').on('submit', function(e) {
        e.preventDefault();
        return false;
      });
    });

    // Start Button
    startBtn.onclick = () => {
      if (recognitionActive) return;
      
      finalText = '';
      original.textContent = 'Listening...';
      translated.textContent = '';
      
      recognition.lang = sourceLang.value;
      recognition.start();
      recognitionActive = true;
      
      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    // Stop Button
    stopBtn.onclick = () => {
      if (!recognitionActive) return;
      
      recognition.stop();
      recognitionActive = false;
      
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // Speech Recognition Events
    recognition.onresult = (event) => {
      finalText = event.results[0][0].transcript;
      original.textContent = finalText;
    };

    recognition.onend = async () => {
      recognitionActive = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;

      if (!finalText.trim()) {
        original.textContent = 'No speech detected.';
        return;
      }

      translated.textContent = 'Translating...';

      try {
        const response = await fetch('http://localhost:5000/translate', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            q: finalText,
            source: sourceLang.value,
            target: targetLang.value,
            format: 'text'
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }

        translated.textContent = data.translatedText || 'Translation failed.';
        
      } catch (err) {
        console.error('Translation error:', err);
        translated.textContent = 'Translation failed. Please try again.';
        
        if (err.message.includes('Failed to fetch')) {
          translated.textContent = 'Cannot connect to translation server. Make sure the backend is running.';
        }
      }
    };

    recognition.onerror = (event) => {
      console.error('Speech recognition error:', event.error);
      recognitionActive = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      
      original.textContent = 'Speech recognition error.';
      
      if (event.error === 'not-allowed') {
        alert('Please allow microphone access to use speech recognition.');
      } else {
        alert('Speech recognition error: ' + event.error);
      }
    };
  </script>
</body>
</html>
